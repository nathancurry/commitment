[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitment"
version = "0.1.0"
description = "Bounded local-model journal mutation supervisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
commitment = "commitment.supervisor:main"
commitment-agent = "commitment.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
